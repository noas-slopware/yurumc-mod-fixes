modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "yurumc_airwavesfix"
version = "1.0.0"
displayName = "YuruMC Airwaves Fixes"
authors = "Noa Himesaka"
description = '''
Fixes for Create: Airwaves 0.1.0: removes its microphone and voice chat, makes the Tape Player record music discs (vanilla and Etched) instead, and fixes server-side abuse and lag issues.
'''

[[mixins]]
config = "yurumc_airwavesfix.mixins.json"

# The mixins target this exact build of Airwaves (0.1.0 build 9.9, shipped as airwaves-1.21.1-0.1.1-atm10.jar).
# ordering = AFTER also puts this mod's resources above Airwaves', which the lang, manual and recipe overrides need.
[[dependencies.yurumc_airwavesfix]]
modId = "airwaves"
type = "required"
versionRange = "[0.1.0]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.yurumc_airwavesfix]]
modId = "etched"
type = "optional"
versionRange = "[5.1.0,6)"
ordering = "AFTER"
side = "BOTH"
